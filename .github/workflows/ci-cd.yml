name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to registry.npmjs.org'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7

  # Runs every story's `play` function in a real browser. This is the only check
  # that catches effect-timing bugs: jsdom's Testing Library wraps `fireEvent` in
  # `act()` and flushes effects first, so a race between a keypress and a
  # registration effect passes every unit test and still breaks in a browser.
  storybook-tests:
    name: Storybook Interaction Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse the bundle the build job already produced rather than rebuilding it.
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static

      - name: Install Playwright browser
        run: pnpm --filter @tesserix/storybook exec playwright install --with-deps chromium

      - name: Run interaction tests
        run: |
          pnpm --filter @tesserix/storybook exec http-server storybook-static --port 6006 --silent &
          pnpm --filter @tesserix/storybook exec wait-on tcp:127.0.0.1:6006 --timeout 60000
          pnpm --filter @tesserix/storybook run test-storybook --url http://127.0.0.1:6006 --maxWorkers=2

  changeset:
    name: Version and Publish Packages
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    permissions:
      contents: write
      # The release PR. Version bumps arrive as a PR a human merges, rather
      # than a push straight to a protected branch — see the changesets step.
      pull-requests: write
      # Lets the runner mint the OIDC token npm exchanges for a short-lived
      # publish credential. Without it, trusted publishing cannot authenticate.
      id-token: write
    steps:
      # No `token:`. GITHUB_TOKEN is enough now that nothing here pushes to
      # main: it is minted per run, scoped to this repository, and expires
      # with the job. This step previously carried ADMIN_TOKEN, a human
      # admin's PAT that satisfied main's rulesets by BYPASSING them — a
      # credential valid against every repository that account can admin,
      # used to push one version commit.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@tesserix'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # A stray per-package .npmrc would pin a registry or a stale token and
      # take precedence over the OIDC credential. Kept as its own step now
      # that publishing runs inside the changesets action rather than a script
      # we control — the action cannot do this for us.
      - name: Remove stray per-package .npmrc files
        run: rm -f packages/*/.npmrc

      # Two modes, decided by whether unreleased changesets exist:
      #
      #   changesets present -> open/update a "Version Packages" PR
      #   none present       -> the versions on main are already bumped, so
      #                         publish them
      #
      # The version bump therefore reaches main through a PR someone merges,
      # not a push that has to bypass main's rulesets. That is what removes
      # the need for ADMIN_TOKEN: the old flow ran `git push` at a protected
      # branch and needed a credential privileged enough to ignore the
      # protection, for a commit nobody reviewed.
      #
      # It also puts a human between a merge and a public npm publish.
      # @tesserix/web@2.4.0 went to the registry minutes after a PR landed,
      # with the version bump seen by no one.
      #
      # `publish` runs in THIS workflow file deliberately: npm's trusted
      # publisher names ci-cd.yml, so moving the publish elsewhere breaks
      # OIDC authentication with no token to fall back on.
      - name: Create the release PR, or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A blocked release PR is the one failure in this job that looks exactly
      # like a flake and is not. GitHub's account-level switch — Settings ->
      # Actions -> General -> "Allow GitHub Actions to create and approve pull
      # requests" — overrides this job's own `pull-requests: write`, so
      # `changesets/action` versions the packages successfully and then dies on
      # `HttpError: GitHub Actions is not permitted to create or approve pull
      # requests`. The computed bump is discarded, and the only evidence is
      # buried in this job's log: a release can sit unshipped for days while
      # every surface says "a job went red".
      #
      # This step does not fix that — the fix is either a scoped GitHub App
      # token for the changesets step, or enabling the switch, and the second
      # also grants Actions the ability to APPROVE pull requests, which is a
      # route around required review. It makes the failure say what it is.
      - name: Explain a discarded release
        if: failure() && steps.changesets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | sort)
          # No unreleased changesets means the action took its publish branch,
          # and whatever failed there is a different problem than this one.
          if [ -z "$pending" ]; then
            echo "The changesets step failed with no unreleased changesets present, so it failed while PUBLISHING, not while opening the release PR."
            exit 0
          fi

          # The action pushes its version branch and only then asks for the PR,
          # so a pushed branch with no PR is the fingerprint of the blocked
          # call specifically — as opposed to `pnpm version-packages` itself
          # having failed, which leaves no branch behind and is a different
          # bug wearing the same red X.
          if git ls-remote --exit-code --heads origin changeset-release/main >/dev/null 2>&1; then
            stage="versioned the packages, pushed \`changeset-release/main\`, and failed at the point of opening its PR"
          else
            stage="failed before it could push a version branch, so this may be \`pnpm version-packages\` itself rather than the blocked PR call — read the step log"
          fi

          # Requires admin scope, which GITHUB_TOKEN does not have. Read it
          # anyway: on a self-hosted or admin-scoped run it names the cause
          # outright, and the guidance below stands either way.
          allowed=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
            --jq '.default_workflow_permissions' 2>/dev/null || echo "unreadable")

          echo "::error title=Release computed and discarded::A version bump was computed from $(echo "$pending" | wc -l | tr -d ' ') unreleased changeset(s) and was not released. Nothing was published; the changesets are still on main and the next push will hit this again."
          {
            echo "## The release did not ship"
            echo
            echo "\`changesets/action\` $stage."
            echo "Unreleased changesets still on \`main\`:"
            echo
            echo '```'
            echo "$pending"
            echo '```'
            echo
            echo "This job already requests \`pull-requests: write\`. That is overridden by"
            echo "**Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\"**,"
            echo "which is off at the repository and organisation level (repo \`default_workflow_permissions\`: \`$allowed\`)."
            echo
            echo "Choose one:"
            echo
            echo "1. Give the changesets step a **GitHub App installation token** scoped to this repository with \`pull_requests: write\`. Narrowest, and keeps the review model intact."
            echo "2. **Enable the switch.** One click — and it also lets Actions *approve* PRs, a route around required review. This repo deliberately removed \`ADMIN_TOKEN\` for that reason."
            echo "3. Open the version PR by hand: \`pnpm version-packages\`, commit as \`chore: version packages\`, open the PR, merge. Publishing then works unaided — the publish branch needs only \`id-token: write\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when something was actually published. On a run that merely opened
      # the release PR there is no new version, and checking for one would fail
      # a run that did exactly what it should.
      - name: Verify the public registry has the published version
        if: steps.changesets.outputs.published == 'true' 
        run: |
          version=$(node -p "require('./packages/web/package.json').version")
          # npm's read path is eventually consistent: a version that has just
          # been accepted is briefly invisible to `npm view`, so a single check
          # reports a false failure for a publish that actually succeeded.
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "@tesserix/web@$version" version --registry https://registry.npmjs.org 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Verified @tesserix/web@$version on registry.npmjs.org (attempt $attempt)"
              exit 0
            fi
            echo "Not visible yet (attempt $attempt); waiting for the registry to catch up."
            sleep 10
          done
          echo "::error::@tesserix/web@$version is not on registry.npmjs.org 60s after publishing. Consumers resolving from the public registry are stranded on the previous version."
          exit 1

