name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to registry.npmjs.org'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7

  changeset:
    name: Version and Publish Packages
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    permissions:
      contents: write
      # Lets the runner mint the OIDC token npm exchanges for a short-lived
      # publish credential. Without it, trusted publishing cannot authenticate.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@tesserix'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changesets
        id: check-changesets
        run: |
          if [ -n "$(find .changeset -name '*.md' -not -name 'README.md' -print -quit)" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          pnpm version-packages
          git add .
          git commit -m "chore: version packages" || echo "No version changes"
          git push

      # registry.npmjs.org is the only registry these packages publish to.
      #
      # Trusted publishing: no NPM_TOKEN anywhere. npm exchanges the workflow's
      # OIDC identity for a short-lived credential, which is why the trusted
      # publisher on npmjs.com must name this exact workflow file (ci-cd.yml).
      #
      # Must NOT be continue-on-error: a silent failure here strands every
      # consumer on the previous version — which is what happened to
      # @tesserix/otto-widget@0.6.0 and @tesserix/web@1.8.0.
      - name: Publish to npm (public registry)
        if: steps.check-changesets.outputs.has_changesets == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: |
          # A stray per-package .npmrc would pin a registry or a stale token and
          # take precedence over the OIDC credential.
          rm -f packages/*/.npmrc
          pnpm release

      - name: Verify the public registry has the published version
        if: steps.check-changesets.outputs.has_changesets == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: |
          version=$(node -p "require('./packages/web/package.json').version")
          # npm's read path is eventually consistent: a version that has just
          # been accepted is briefly invisible to `npm view`, so a single check
          # reports a false failure for a publish that actually succeeded.
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "@tesserix/web@$version" version --registry https://registry.npmjs.org 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Verified @tesserix/web@$version on registry.npmjs.org (attempt $attempt)"
              exit 0
            fi
            echo "Not visible yet (attempt $attempt); waiting for the registry to catch up."
            sleep 10
          done
          echo "::error::@tesserix/web@$version is not on registry.npmjs.org 60s after publishing. Consumers resolving from the public registry are stranded on the previous version."
          exit 1

