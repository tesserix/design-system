packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: false
  sharp: false

# Transitive dependency pins. pnpm 11 no longer reads `pnpm.overrides` from
# package.json — this is the only place overrides are honoured.
overrides:
  '@babel/core': ^7.29.6
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  '@xmldom/xmldom': ^0.9.10
  # Exact pin: 1.1.17 was published 2026-07-29 and trips pnpm's minimumReleaseAge
  # guard. Restore the caret (^1.1.16) once it has aged past the window.
  brace-expansion@1: 1.1.16
  brace-expansion@5: ^5.0.8
  dompurify: ^3.4.12
  esbuild: ^0.28.1
  flatted: ^3.4.2
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.2.0
  lodash-es: ^4.18.0
  mermaid: ^11.15.0
  minimatch@3: ^3.1.4
  minimatch@10: ^10.2.3
  next: ^16.2.11
  node-forge: ^1.4.0
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss: ^8.5.18
  shell-quote: ^1.8.4
  turbo: ^2.10.7
  undici: ^7.28.0
  uuid: ^11.1.1
  vite: ^7.3.5
  vitest: ^4.1.0
  ws@6: ^6.2.4
  ws@7: ^7.5.11
  ws@8: ^8.21.0
  yaml: ^2.8.3
