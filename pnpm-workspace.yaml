packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: false
  sharp: false

# Transitive dependency pins. pnpm 11 no longer reads `pnpm.overrides` from
# package.json — this is the only place overrides are honoured.
overrides:
  '@babel/core': ^7.29.6
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  '@xmldom/xmldom': ^0.9.10
  brace-expansion@1: ^1.1.17
  brace-expansion@5: ^5.0.9
  dompurify: ^3.4.13
  esbuild: ^0.28.1
  flatted: ^3.4.2
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  lodash-es: ^4.18.0
  mermaid: ^11.16.1
  minimatch@3: ^3.1.4
  minimatch@10: ^10.2.3
  next: ^16.2.11
  node-forge: ^1.4.0
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss: ^8.5.23
  shell-quote: ^1.8.4
  # Above next@16's declared optional range (^0.34.5) to clear the libvips CVEs
  # (CVE-2026-33327/33328/35590/35591). Only used for build-time image
  # optimization in apps/docs — verify that build if next is upgraded.
  sharp: ^0.35.0
  turbo: ^2.10.7
  undici: ^7.29.0
  uuid: ^11.1.1
  vite: ^7.3.5
  vitest: ^4.1.0
  ws@6: ^6.2.4
  ws@7: ^7.5.11
  ws@8: ^8.21.0
  yaml: ^2.8.3
